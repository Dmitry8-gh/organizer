<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Your Assist переехал</title>
<meta name="robots" content="noindex" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1d2030; text-align: center;
    background: radial-gradient(600px 400px at 90% 0%, rgba(255,196,120,.45), transparent 70%),
                radial-gradient(600px 460px at 0% 40%, rgba(173,156,255,.35), transparent 70%), #fbf7f2; }
  .card { max-width: 380px; padding: 36px 28px; border-radius: 32px; background: rgba(255,255,255,.85);
    box-shadow: 0 18px 50px rgba(80,70,140,.14); }
  .emoji { font-size: 52px; }
  h1 { font-size: 26px; margin: 14px 0 10px; letter-spacing: -.01em; }
  p { color: #5b6075; line-height: 1.45; font-size: 16px; }
  a.btn { display: block; margin-top: 22px; padding: 15px; border-radius: 999px; color: #fff; font-weight: 700; text-decoration: none;
    background: linear-gradient(135deg, #7c5cff, #2f8cff); box-shadow: 0 10px 26px rgba(90,110,255,.35); }
  small { display: block; margin-top: 16px; color: #8a8fa3; font-size: 13px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🏡✨</div>
    <h1>Приложение переехало</h1>
    <p>Теперь оно называется <b>Your Assist</b> и живёт по новому адресу:</p>
    <a class="btn" href="https://yourassist.ru">Открыть yourassist.ru</a>
    <small>Добавьте его на экран «Домой» заново, а старую иконку можно удалить. Вход — по приглашению.</small>
  </div>
</body>
</html>
